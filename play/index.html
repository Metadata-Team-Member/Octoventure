<body>
  <canvas id="game"></canvas>

  <!-- No gameplay HUD on purpose: the octopus itself shows how it is doing. (#debug only shows with ?debug=1) -->
  <div id="debug" hidden></div>
  <div id="hurt"></div>
  <div id="fade"></div>

  <!-- on-screen controls: only revealed once a touch screen is actually used -->
  <div id="touch" hidden>
    <div id="stick"><div id="knob"></div></div>
    <button id="btn-sprint">RUN</button>
    <button id="btn-camo">CAMO</button>
  </div>

  <div id="start" class="overlay">
    <button id="play" class="big">Play</button>
  </div>

  <div id="pause" class="overlay" hidden>
    <button id="resume" class="big">Resume</button>
    <div id="opts">
      <button class="chip" data-diff="gentle">Gentle</button><button class="chip" data-diff="normal">Normal</button><button class="chip" data-diff="harsh">Harsh</button>
      <span class="sep"></span>
      <button class="chip" id="chip-daily">Daily</button><button class="chip" id="chip-new">New world</button>
    </div>
  </div>

  <div id="end" class="overlay" hidden>
    <div class="card">
      <h1 id="end-title"></h1>
      <button id="restart" class="big">Restart game</button>
    </div>
  </div>

  <div id="loading" class="overlay" hidden><div class="card"><h2>Building a new world…</h2></div></div>

</body>
</html>
