<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <title>Blue-Ringed Octopus: Run to the Sea</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%90%99%3C/text%3E%3C/svg%3E" />
</head>
<body>
  <canvas id="game"></canvas>

  <!-- No gameplay HUD on purpose: the octopus itself shows how it is doing. (#debug only shows with ?debug=1) -->
  <div id="debug" hidden></div>
  <div id="hurt"></div>

  <!-- on-screen controls: only revealed once a touch screen is actually used -->
  <div id="touch" hidden>
    <div id="stick"><div id="knob"></div></div>
    <button id="btn-sprint">RUN</button>
    <button id="btn-camo">CAMO</button>
  </div>

  <div id="start" class="overlay">
    <div class="card start">
      <h1>🐙 Blue-Ringed Octopus<br><span class="sub-title">Run to the Sea</span></h1>
      <button id="play" class="big">Click to start</button>
    </div>
  </div>

  <div id="end" class="overlay" hidden>
    <div class="card">
      <h1 id="end-title"></h1>
      <button id="restart" class="big">Restart game</button>
    </div>
  </div>

  <div id="loading" class="overlay" hidden><div class="card"><h2>Building a new world…</h2></div></div>

  <script type="module" src="/src/main.js"></script>
</body>
</html>
